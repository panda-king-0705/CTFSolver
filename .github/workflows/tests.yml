name: tests
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (dev extras only — control plane is stdlib-only)
        run: pip install -e ".[dev]"
      - name: Run the offline test suite
        run: pytest -q
